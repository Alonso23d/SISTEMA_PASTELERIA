version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=dulce_gusto

  frontend:
    build: ./proyecto-frontend
    ports:
      - "3000:80"

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=dulce_gusto
      - MYSQL_ROOT_PASSWORD=secret