name: CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Instalar dependencias de Composer
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copiar .env de ejemplo
        working-directory: ./backend
        run: cp .env.example .env

      - name: Generar APP_KEY
        working-directory: ./backend
        run: php artisan key:generate

      - name: Verificar que la aplicacion arranca correctamente
        working-directory: ./backend
        run: php artisan about

  ecommerce:
    name: Frontend E-commerce (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyecto-frontend/e-commerce/package-lock.json

      - name: Instalar dependencias
        working-directory: ./proyecto-frontend/e-commerce
        run: npm install

      - name: Construir proyecto (build)
        working-directory: ./proyecto-frontend/e-commerce
        run: npm run build

  panel-admin:
    name: Frontend Panel Admin (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyecto-frontend/panel-admin/package-lock.json

      - name: Instalar dependencias
        working-directory: ./proyecto-frontend/panel-admin
        run: npm install

      - name: Construir proyecto (build)
        working-directory: ./proyecto-frontend/panel-admin
        run: npm run build
